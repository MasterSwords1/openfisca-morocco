# Prime exceptionnelle ASD (Loi 41-26 arts. 16 bis / 16 bis bis, Décret
# 2-26-434 art. 10 bis, BO n° 7530 du 30 juillet 2026). Montant égal aux aides
# perdues, une seule fois, douze mois au maximum, continus ou non.

- name: Août 2026 — douze mois restants et 800 DH de référence
  period: 2026-08
  input:
    persons:
      adulte: {}
    households:
      famille:
        adults: [adulte]
        montant_asd_avant_perte: 800.0
        mois_restants_prime_exceptionnelle: 12
  output:
    households:
      famille:
        prime_exceptionnelle_asd: 800.0

