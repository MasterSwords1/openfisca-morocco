# IR — revenus professionnels, fonciers et du capital (CGI 2026).
# Barème 2026 inchangé : 0 / 10 / 20 / 30 / 34 / 37 %.
# Revenus fonciers : abattement de 40 %, retenue de 10 % sous 120 000 DH de brut
# (15 % au-delà), pas de retenue si le brut annuel ne dépasse pas 40 000 DH.
# Capitaux mobiliers : taux libératoires, hors barème.

- name: Revenu professionnel seul — barème global
  period: 2026
  input:
    persons:
      contribuable:
        revenu_professionnel_net: 100000
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        revenu_global_imposable: 100000
        ir_brut: 12000
        impot_sur_le_revenu: 12000

- name: Professionnel et foncier sous 120 000 DH — retenue de 10 % imputée
  period: 2026
  input:
    persons:
      contribuable:
        revenu_professionnel_net: 100000
        revenus_fonciers_bruts: 100000
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        revenu_foncier_net: 60000
        revenu_global_imposable: 160000
        retenue_fonciere: 10000
        ir_brut: 32400
        impot_sur_le_revenu: 22400

- name: Foncier au-dessus de 120 000 DH — retenue de 15 %
  period: 2026
  input:
    persons:
      contribuable:
        revenu_professionnel_net: 100000
        revenus_fonciers_bruts: 150000
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        revenu_foncier_net: 90000
        revenu_global_imposable: 190000
        retenue_fonciere: 22500
        impot_sur_le_revenu: 20400

