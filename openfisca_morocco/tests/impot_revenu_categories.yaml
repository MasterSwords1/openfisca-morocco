- name: Capitaux mobiliers — taux libératoires hors barème
  period: 2026
  input:
    persons:
      contribuable:
        dividendes_bruts: 100000
        interets_bruts: 50000
        plus_values_actions_cotees: 20000
        plus_values_titres_non_cotes: 10000
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        revenu_global_imposable: 0
        impot_sur_le_revenu: 0
        impot_dividendes: 11250
        impot_interets: 15000
        impot_plus_values: 5000
        impot_capitaux_mobiliers: 31250
    households:
      menage:
        impot_sur_le_revenu_menage: 31250

- name: Ménage à revenus mixtes — un impôt par personne, total du ménage
  period: 2026
  input:
    persons:
      conjoint1:
        revenu_professionnel_net: 100000
        dividendes_bruts: 10000
      conjoint2:
        revenu_professionnel_net: 60000
        revenus_fonciers_bruts: 50000
    households:
      menage:
        adults: [conjoint1, conjoint2]
  output:
    persons:
      conjoint1:
        impot_sur_le_revenu: 12000
        impot_capitaux_mobiliers: 1125
      conjoint2:
        revenu_global_imposable: 90000
        retenue_fonciere: 5000
        impot_sur_le_revenu: 4000
    households:
      menage:
        impot_sur_le_revenu_menage: 17125

