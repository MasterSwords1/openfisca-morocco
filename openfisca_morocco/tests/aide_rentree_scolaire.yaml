# Aide de rentrée scolaire (Décret n° 2-24-706, BO n° 7321 du 29 juillet 2024).
# Versée en septembre, 200 DH au primaire/collégial, 300 DH au qualifiant,
# pour les enfants scolarisés dans un établissement public, dans la limite de
# six enfants.

- name: Rentrée 2024 — deux enfants au collégial et un au qualifiant
  period: 2024-09
  input:
    persons:
      parent: {}
      enfant1:
        enfant_eligible_asd: true
        niveau_scolaire_asd: primaire_collegial
        scolarise_etablissement_public: true
        rang_enfant_asd: 1
      enfant2:
        enfant_eligible_asd: true
        niveau_scolaire_asd: primaire_collegial
        scolarise_etablissement_public: true
        rang_enfant_asd: 2
      enfant3:
        enfant_eligible_asd: true
        niveau_scolaire_asd: qualifiant
        scolarise_etablissement_public: true
        rang_enfant_asd: 3
    households:
      famille:
        adults: [parent]
        children: [enfant1, enfant2, enfant3]
        score_rsu: 4.0
        conditions_administratives_asd_remplies: true
  output:
    households:
      famille:
        aide_rentree_scolaire: 700.0

