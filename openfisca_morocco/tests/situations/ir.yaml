      Conjoint1:
        salaire_brut: {2026: 96000}
        salaire_brut_global: {2026: 96000}
        nombre_personnes_a_charge: {2026: 3}
      Conjoint2:
        salaire_brut: {2026: 72000}
        salaire_brut_global: {2026: 72000}
