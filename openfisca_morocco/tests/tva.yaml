    tva_operation_transitoire: electricite
    chiffre_affaires_taux_transitoire: 100000
  output:
    tva_taux_transitoire: 0
    tva_collectee_taux_transitoire: 0

- name: Prorata de 50 % — la TVA déductible est réduite de moitié
