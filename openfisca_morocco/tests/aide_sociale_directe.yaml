# Aide sociale directe (ASD) — estimation des règles et montants publiés.
# Le résultat n'établit pas l'inscription effective au RNP/RSU ni une décision ANSS.

- name: Ménage administrativement admissible sans enfant — aide forfaitaire de 500 DH
  period: 2026-01
  input:
    persons:
      adulte: {}
    households:
      famille:
        adults: [adulte]
        score_rsu: 9.743001
        conditions_administratives_asd_remplies: true
        eligible_aide_forfaitaire_asd: true
  output:
    households:
      famille:
        aide_sociale_directe: 500.0

