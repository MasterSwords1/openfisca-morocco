# Tests of the Moroccan impôt sur le revenu (IR), CGI articles 59, 73-I and 74.
# Figures cross-checked against the validated Catala encoding of the CGI in the
# morocco-holy-graph corpus (laws/ma_tax_law/tests/test_catala_tax.py).
#
# Pipeline: brut imposable → frais professionnels (art. 59) → net imposable →
# barème (art. 73-I) → impôt brut → déduction charges de famille (art. 74) →
# impôt net.
# Annual salary/exemption inputs remain totals: OpenFisca divides them between
# months before the annual IR calculation. Keep these cases as compatibility tests.

- name: Salaires mensuels alimentant le barème annuel et les cotisations CNSS/AMO
  period: 2025
  absolute_error_margin: 0.02
  input:
    salaire_brut:
      2025: 120000
    salaire_brut_global:
      2025-01: 10000
      2025-02: 10000
      2025-03: 10000
      2025-04: 10000
      2025-05: 10000
      2025-06: 10000
      2025-07: 10000
      2025-08: 10000
      2025-09: 10000
      2025-10: 10000
      2025-11: 10000
      2025-12: 10000
    nombre_personnes_a_charge: 0
  output:
    cotisations_sociales_obligatoires: 5937.60
    frais_professionnels: 30000  # 25 % de 120 000, sur le brut imposable
    salaire_net_imposable: 84062.40
    impot_sur_le_revenu: 7218.72

- name: Salaire de 36 000 DH sans cotisations — sous le seuil d'exonération, impôt nul
  period: 2025
  input:
    salaire_brut_global: 36000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 0
    nombre_personnes_a_charge: 0
  output:
    frais_professionnels: 12600  # 35 % de 36 000 (< 78 000 DH)
    salaire_net_imposable: 23400
    ir_brut: 0
    impot_sur_le_revenu: 0

- name: Salaire de 80 000 DH — frontière haute de la tranche à 10 %
  period: 2025
  input:
    salaire_brut_global: 80000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 0
    nombre_personnes_a_charge: 0
  output:
    frais_professionnels: 20000  # 25 % de 80 000 (> 78 000 DH)
    salaire_net_imposable: 60000
    ir_brut: 2000  # 10 % × 60 000 − 4 000

- name: Salaire de 100 000 DH — tranche à 20 %
  period: 2025
  input:
    salaire_brut_global: 100000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 0
    nombre_personnes_a_charge: 0
  output:
    frais_professionnels: 25000  # 25 %, plafonné à 35 000
    salaire_net_imposable: 75000
    ir_brut: 5000  # 20 % × 75 000 − 10 000

- name: Salaire de 200 000 DH avec 20 000 DH de cotisations — tranche à 34 %
  period: 2025
  input:
    salaire_brut_global: 200000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 20000
    nombre_personnes_a_charge: 0
  output:
    frais_professionnels: 35000  # 25 % de 180 000 = 45 000, plafonné à 35 000
    salaire_net_imposable: 145000
    ir_brut: 27300  # 34 % × 145 000 − 22 000
    impot_sur_le_revenu: 27300

- name: Même situation avec trois personnes à charge — déduction de 1 500 DH
  period: 2025
  input:
    salaire_brut_global: 200000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 20000
    nombre_personnes_a_charge: 3
  output:
    ir_brut: 27300
    deduction_charges_famille: 1500
    impot_sur_le_revenu: 25800

- name: Très haut salaire — 500 000 DH, plafond des frais professionnels atteint
  period: 2025
  input:
    salaire_brut_global: 500000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 20000
    nombre_personnes_a_charge: 8
  output:
    frais_professionnels: 35000
    salaire_net_imposable: 445000
    ir_brut: 137250  # 37 % × 445 000 − 27 400
    deduction_charges_famille: 3000  # plafonné à 6 personnes
    impot_sur_le_revenu: 134250

# --- Historical scales and deductions (issue #46) ---
# Barème 2010–2024: 0 / 30 000 / 50 000 / 60 000 / 80 000 / 180 000 with
# 0 / 10 / 20 / 30 / 34 / 38 %. Frais professionnels: 20 % capped at 30 000 DH
# until 2022, then 35 % up to 78 000 DH and 25 % above, capped at 35 000 DH.
# Family deduction: 360 DH per dependent, capped at 6 (2 160 DH).

- name: 2010 — barème historique et frais professionnels à 20 %
  period: 2010
  input:
    salaire_brut_global: 60000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 0
    nombre_personnes_a_charge: 0
  output:
    frais_professionnels: 12000  # 20 % de 60 000, sous le plafond de 30 000
    salaire_net_imposable: 48000
    ir_brut: 1800  # 10 % × 48 000 − 3 000
    impot_sur_le_revenu: 1800

- name: 2018 — barème historique et deux personnes à charge à 360 DH
  period: 2018
  input:
    salaire_brut_global: 120000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 0
    nombre_personnes_a_charge: 2
  output:
    frais_professionnels: 24000  # 20 % de 120 000
    salaire_net_imposable: 96000
    ir_brut: 15440  # 34 % × 96 000 − 17 200
    deduction_charges_famille: 720  # 2 × 360
    impot_sur_le_revenu: 14720

- name: 2022 — plafond historique de 30 000 DH et tranche à 38 %
  period: 2022
  input:
    salaire_brut_global: 240000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 0
    nombre_personnes_a_charge: 3
  output:
    frais_professionnels: 30000  # 20 % de 240 000 = 48 000, plafonné à 30 000
    salaire_net_imposable: 210000
    ir_brut: 55400  # 38 % × 210 000 − 24 400
    deduction_charges_famille: 1080  # 3 × 360
    impot_sur_le_revenu: 54320

- name: 2023 — frais professionnels à 35 %/25 % et plafond de 35 000 DH
  period: 2023
  input:
    salaire_brut_global: 100000
    elements_exoneres: 0
    cotisations_sociales_obligatoires: 0
    nombre_personnes_a_charge: 1
  output:
    frais_professionnels: 25000  # 25 % de 100 000 (> 78 000)
    salaire_net_imposable: 75000
    ir_brut: 8500  # 30 % × 75 000 − 14 000
    deduction_charges_famille: 360
    impot_sur_le_revenu: 8140

