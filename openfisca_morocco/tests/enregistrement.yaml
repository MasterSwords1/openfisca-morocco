    households:
      Menage:
        droits_enregistrement: 60000
        frais_conservation_fonciere: 0
        frais_acquisition_immobiliere_totaux: 60000

- name: Petite acquisition — minimum de 100 DH et plancher de conservation
  period: 2026
  input:
