# Droits d'enregistrement et conservation foncière (CGI 2026, décret 2-16-375).
# 4 % locaux construits, 5 % terrains nus, 6 % fonds de commerce ; minimum de
# 100 DH sur les droits proportionnels ; conservation 1,5 % + 100 DH, minimum
# 500 DH, certificat de 100 DH en option.

- name: Local construit — 4 %, conservation et total
  period: 2026
  input:
    persons:
      Parent: {}
    households:
      Menage:
        adults: [Parent]
        type_acquisition_immobiliere: immeuble_bati
        valeur_bien_acquis: {2026: 1000000}
  output:
    households:
      Menage:
        droits_enregistrement: 40000
        frais_conservation_fonciere: 15100
        frais_acquisition_immobiliere_totaux: 55100

- name: Local construit avec certificat de propriété — 100 DH de plus
  period: 2026
  input:
    persons:
      Parent: {}
    households:
      Menage:
        adults: [Parent]
        type_acquisition_immobiliere: immeuble_bati
        valeur_bien_acquis: {2026: 1000000}
        demande_certificat_propriete: true
  output:
    households:
      Menage:
        frais_conservation_fonciere: 15200
        frais_acquisition_immobiliere_totaux: 55200

