# Aide spéciale aux enfants placés (Loi 58-23 art. 16, Décret 2-25-1064,
# BO n° 7468 du 25 décembre 2025). 500 DH par mois et par enfant, en vigueur
# le 25 mars 2026, sans cumul avec l'ASD du ménage pour le même enfant.

- name: Avril 2026 — premier mois complet, aide spéciale de 500 DH
  period: 2026-04
  input:
    persons:
      enfant:
        enfant_place_institution: true
        aide_speciale_accordee: true
    households:
      etablissement:
        children: [enfant]
  output:
    persons:
      enfant:
        aide_speciale_enfant_place: 500.0

- name: Mars 2026 — entrée en vigueur le 25, aucun mois complet payé
  period: 2026-03
  input:
    persons:
      enfant:
        enfant_place_institution: true
        aide_speciale_accordee: true
    households:
      etablissement:
        children: [enfant]
  output:
    persons:
      enfant:
        aide_speciale_enfant_place: 0.0

- name: Février 2026 — décret pas encore en vigueur
  period: 2026-02
  input:
    persons:
      enfant:
        enfant_place_institution: true
        aide_speciale_accordee: true
    households:
      etablissement:
        children: [enfant]
  output:
    persons:
      enfant:
        aide_speciale_enfant_place: 0.0

- name: Enfant non placé — aucune aide spéciale
  period: 2026-04
  input:
    persons:
      enfant: {}
    households:
      etablissement:
        children: [enfant]
  output:
    persons:
      enfant:
        aide_speciale_enfant_place: 0.0

- name: Enfant placé et handicapé — ASD limitée aux autres enfants, aide spéciale pour lui
  period: 2026-06
  input:
    persons:
      parent: {}
      enfant1:
        enfant_eligible_asd: true
        enfant_scolarise: true
        rang_enfant_asd: 1
      enfant2:
        enfant_eligible_asd: true
        enfant_scolarise: true
        rang_enfant_asd: 2
      enfant3:
        enfant_eligible_asd: true
        enfant_handicape: true
        enfant_orphelin_pere: true
        enfant_place_institution: true
        aide_speciale_accordee: true
        rang_enfant_asd: 3
    households:
      famille:
        adults: [parent]
        children: [enfant1, enfant2, enfant3]
        score_rsu: 3.0
        conditions_administratives_asd_remplies: true
  output:
    persons:
      enfant3:
        aide_speciale_enfant_place: 500.0
    households:
      famille:
        aide_sociale_directe: 600.0

- name: Enfant hébergé sans demande acceptée — ASD du ménage maintenue, pas d'aide
  period: 2026-06
  input:
    persons:
      parent: {}
      enfant:
        enfant_eligible_asd: true
        enfant_place_institution: true
        enfant_scolarise: true
        rang_enfant_asd: 1
    households:
      famille:
        adults: [parent]
        children: [enfant]
        score_rsu: 3.0
        conditions_administratives_asd_remplies: true
  output:
    persons:
      enfant:
        aide_speciale_enfant_place: 0.0
    households:
      famille:
        aide_sociale_directe: 500.0

- name: Aide acceptée sans hébergement — incohérence d'entrée, ASD maintenue
  period: 2026-06
  input:
    persons:
      parent: {}
      enfant:
        enfant_eligible_asd: true
        aide_speciale_accordee: true
        enfant_scolarise: true
        rang_enfant_asd: 1
    households:
      famille:
        adults: [parent]
        children: [enfant]
        score_rsu: 3.0
        conditions_administratives_asd_remplies: true
  output:
    persons:
      enfant:
        aide_speciale_enfant_place: 0.0
    households:
      famille:
        aide_sociale_directe: 500.0

- name: Adulte marqué comme hébergé — aucune aide spéciale
  period: 2026-06
  input:
    persons:
      adulte:
        enfant_place_institution: true
        aide_speciale_accordee: true
    households:
      famille:
        adults: [adulte]
  output:
    persons:
      adulte:
        aide_speciale_enfant_place: 0.0
