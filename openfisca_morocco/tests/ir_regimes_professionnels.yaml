# Régimes professionnels (CGI 2026) — CPU, auto-entrepreneur, net simplifié et
# report déficitaire. Les droits complémentaires suivent la table de
# l'article 73-II-B-6° (montants annuels) : <500 → 1 200 ; 500–1 000 → 1 560 ;
# 1 001–2 500 → 2 280 ; 2 501–5 000 → 2 880 ; 5 001–10 000 → 4 200 ;
# 10 001–25 000 → 6 000 ; 25 001–50 000 → 9 000 ; >50 000 → 14 400.

- name: CPU alimentation générale — 6 % du chiffre d'affaires et droit de 1 560 DH
  period: 2026
  input:
    persons:
      contribuable:
        regime_professionnel: cpu
        categorie_professionnelle: alimentation_generale
        chiffre_affaires_professionnel: 100000
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        impot_contribution_professionnelle_unique: 2160
        impot_regimes_professionnels: 2160
        revenu_global_imposable: 0
    households:
      menage:
        impot_sur_le_revenu_menage: 2160

