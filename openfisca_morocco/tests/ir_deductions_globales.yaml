# Déductions de l'article 28 et option foncière de 20 % (CGI 2026).
# Barème 2026 : 30 % × 95 000 − 18 000 = 10 500 ; 30 % × 90 000 − 18 000 = 9 000.

- name: Intérêts de prêt logement plafonnés à 10 % du revenu global
  period: 2026
  input:
    persons:
      contribuable:
        revenu_professionnel_net: 100000
        interets_pret_logement: 50000
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        deductions_revenu_global: 10000
        revenu_imposable_apres_deductions: 90000
        impot_sur_le_revenu: 9000

- name: Intérêts de prêt logement sous le plafond — déduction intégrale
  period: 2026
  input:
    persons:
      contribuable:
        revenu_professionnel_net: 100000
        interets_pret_logement: 5000
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        deductions_revenu_global: 5000
        revenu_imposable_apres_deductions: 95000
        impot_sur_le_revenu: 10500

