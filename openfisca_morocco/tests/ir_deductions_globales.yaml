- name: Option foncière de 20 % — loyers hors barème, impôt libératoire
  period: 2026
  input:
    persons:
      contribuable:
        revenus_fonciers_bruts: 100000
        option_foncier_liberatoire: true
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        revenu_global_imposable: 0
        impot_sur_le_revenu: 0
        impot_foncier_liberatoire: 20000
    households:
      menage:
        impot_sur_le_revenu_menage: 20000

- name: Option foncière de 20 % avec revenu professionnel — barème sur le seul professionnel
  period: 2026
  input:
    persons:
      contribuable:
        revenu_professionnel_net: 100000
        revenus_fonciers_bruts: 100000
        option_foncier_liberatoire: true
    households:
      menage:
        adults: [contribuable]
  output:
    persons:
      contribuable:
        revenu_global_imposable: 100000
        impot_sur_le_revenu: 12000
        impot_foncier_liberatoire: 20000
    households:
      menage:
        impot_sur_le_revenu_menage: 32000

