# Taux de l'impôt sur les sociétés (IS).
#
# Article 19 du Code Général des Impôts (édition 2026) :
#   - 20 % (19-I-A) ;
#   - 35 % lorsque le bénéfice net est égal ou supérieur à 100 000 000 DH
#     (19-I-B), sous réserve des exclusions de cet article ;
#   - 40 % pour les établissements de crédit et organismes assimilés, Bank
#     Al-Maghrib, la Caisse de dépôt et de gestion et les entreprises
#     d'assurances et de réassurance (19-I-C).
#
# Le taux de 20 % ne s'applique à un bénéfice inférieur à 100 000 000 DH que
# si ce bénéfice est resté inférieur à ce montant pendant trois exercices
# consécutifs (19-I-B, alinéas finaux). Cette condition est portée par
# `benefice_sous_seuil_trois_ans` ; les exclusions du taux de 35 % par
# `exclusion_taux_35`.
description: Taux de l'impôt sur les sociétés - article 19 du CGI

taux_normal:
  description: Taux normal de l'impôt sur les sociétés
  unit: /1
  metadata:
    reference:
      - title: >-
          Code Général des Impôts, article 19-I-A — taux normal de 20 % (CGI
