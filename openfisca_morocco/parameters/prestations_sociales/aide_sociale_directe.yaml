# Aide sociale directe (ASD)
# Sources: Loi n° 58-23 and Décrets n° 2-23-1067 / 2-23-1068.
# Amending texts: Décret n° 2-24-706 (adds the school-return table to the
# annex), Loi n° 41-26 (arts. 16 bis / 16 bis bis, art. 17) and Décret
# n° 2-26-434 (art. 10 bis). Décret n° 2-25-1064 implements article 16 for
# children in protection institutions; it does not amend Décret 2-23-1067.
# Official texts: https://www.anss.gov.ma/fr/lois-decrets
# Amounts follow the Décret 2-23-1067 annex as published by the ANSS
# (https://www.anss.gov.ma/fr/typologies-d-aides).

description: Barème de l'aide sociale directe (ASD)

# Modèle des montants publiés. L'accès effectif dépend aussi des conditions
# individuelles, de l'inscription au RSU et de l'examen du dossier par l'ANSS.

seuil_score_rsu:
  description: >-
    Seuil d'éligibilité au régime ASD, appliqué à l'indice socio-économique du
    ménage calculé par le RSU (9,743001 dans le texte officiel)
  unit: /1
  metadata:
    reference:
      - title: >-
          Décret n° 2-23-1068, article 1 — BO n° 7253 du 4 décembre 2023,
          p. 10239 (seuil fixé à 9,743001, sans modification publiée)
        href: https://www.anss.gov.ma/sites/default/files/decrets/decret_n2.23.1068_AR.pdf
      - title: >-
          ANSS, conditions d'éligibilité — indice socio-économique inférieur ou
          égal au seuil de 9,743001
        href: https://www.anss.gov.ma/fr/conditions-d-eligibilite
  values:
    2023-12-01:
      value: 9.743001

plancher_mensuel:
  description: Plancher minimum global mensuel garanti au ménage bénéficiaire
  unit: currency-MAD
  metadata:
    reference:
      - title: >-
          ANSS, typologies des aides — « Le montant des aides sociales directes
          mensuelles est systématiquement revalorisé à 500 DH dans le cas où le
          total est inférieur à ce seuil » (le texte primaire de cette clause
          n'a pas été vérifié)
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 500.0

montant_enfant_scolarise_ou_moins_de_6_ans:
  description: >-
    Allocation mensuelle de base par enfant parmi les trois premiers, scolarisé,
    âgé de moins de six ans ou en situation de handicap lourd
  unit: currency-MAD
  metadata:
    reference:
      - title: >-
          Décret n° 2-23-1067, annexe (complétée par Décret n° 2-24-706) —
          montants des enfants scolarisés ou de moins de 6 ans
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 200.0
    2025-01-01:
      value: 250.0
    2026-01-01:
      value: 300.0

montant_enfant_non_scolarise_6_ans_et_plus:
  description: >-
    Allocation mensuelle de base par enfant non scolarisé âgé d'au moins six
    ans, parmi les trois premiers
  unit: currency-MAD
  metadata:
    reference:
      - title: >-
          Décret n° 2-23-1067, annexe (complétée par Décret n° 2-24-706) —
          montants des enfants non scolarisés
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 150.0
    2025-01-01:
      value: 175.0
    2026-01-01:
      value: 200.0

montant_enfant_scolarise_rang_4_a_6:
  description: Allocation mensuelle de base par enfant scolarisé de rang 4 à 6
  unit: currency-MAD
  metadata:
    reference:
      - title: Décret n° 2-23-1067, annexe — 36 DH par enfant scolarisé de rang 4 à 6 (montant non revalorisé)
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 36.0

montant_enfant_non_scolarise_rang_4_a_6:
  description: Allocation mensuelle de base par enfant non scolarisé de rang 4 à 6
  unit: currency-MAD
  metadata:
    reference:
      - title: Décret n° 2-23-1067, annexe — 24 DH par enfant non scolarisé de rang 4 à 6 (montant non revalorisé)
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 24.0

montant_complement_orphelin:
  description: >-
    Soutien complémentaire mensuel par enfant orphelin de père parmi les trois
    premiers, lorsque l'enfant est scolarisé ou âgé de moins de six ans (la
    condition imprimée dans l'annexe ne vise pas le handicap). S'ajoute au
    montant de base : 200/250/300 + 150/125/100 = 350/375/400 DH pour les
    ménages de mères-veuves
  unit: currency-MAD
  metadata:
    reference:
      - title: >-
          Décret n° 2-23-1067, annexe, section 2 — soutien complémentaire aux
          orphelins de père (« دون 6 سنوات أو يتابع دراسته ») ; totaux publiés
          par l'ANSS pour les mères-veuves
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 150.0
    2025-01-01:
      value: 125.0
    2026-01-01:
      value: 100.0

montant_complement_handicap:
  description: >-
    Soutien complémentaire mensuel par enfant en situation de handicap lourd,
    à tous les rangs (le rang 7 et plus ne perçoit que ce soutien)
  unit: currency-MAD
  metadata:
    reference:
      - title: >-
          Décret n° 2-23-1067, annexe, section 2 — 100 DH par enfant en situation
          de handicap ; colonnes 300/350/400 et 136/100 de l'ANSS
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 100.0

aide_forfaitaire_mensuelle:
  description: >-
    Allocation mensuelle forfaitaire versée aux ménages sans enfant à charge
    éligible (personnes de 21 ans et plus)
  unit: currency-MAD
  metadata:
    reference:
      - title: >-
          Loi n° 58-23, article 4 et Décret n° 2-23-1067 — allocation forfaitaire
          de 500 DH par mois et par ménage
        href: https://www.anss.gov.ma/fr/typologies-d-aides
  values:
    2023-12-01:
      value: 500.0

plafond_enfants:
  description: >-
    Plafond de six enfants pris en compte pour les montants de base. Le calcul
    parcourt les rangs 1 à 6 : une valeur supérieure à 6 n'étend pas la boucle.
  unit: /1
  metadata:
    reference:
      - title: Loi n° 58-23, article 2 — plafond de six enfants à charge
        href: https://www.anss.gov.ma/sites/default/files/decrets/Loi_n58.23_AR.pdf
  values:
    2023-12-01:
      value: 6

prime_naissance_premier_enfant:
  description: Prime forfaitaire lors de la première naissance
  unit: currency-MAD
  metadata:
    reference:
      - title: Loi n° 58-23, article 2, paragraphe 3 et Décret n° 2-23-1067, annexe — première naissance
        href: https://www.anss.gov.ma/sites/default/files/decrets/decret_n2.23.1067_AR.pdf
  values:
    2023-12-01:
      value: 2000.0

prime_naissance_deuxieme_enfant:
  description: Prime forfaitaire lors de la deuxième naissance
  unit: currency-MAD
  metadata:
    reference:
      - title: Loi n° 58-23, article 2, paragraphe 3 et Décret n° 2-23-1067, annexe — deuxième naissance
        href: https://www.anss.gov.ma/sites/default/files/decrets/decret_n2.23.1067_AR.pdf
  values:
    2023-12-01:
      value: 1000.0

# Non modélisé : le projet de décret n° 2.26.838, adopté en Conseil de
# gouvernement le 12 novembre 2026 mais non publié au Bulletin Officiel à la
# date de cette version, porte le plancher et l'aide forfaitaire de 500 à
# 600 DH à compter du 1er janvier 2027. Ne pas l'appliquer avant publication.
# Les trois aides suivantes (rentrée scolaire, enfants placés, prime
# exceptionnelle) sont définies plus bas dans ce fichier.

# --- Aide de rentrée scolaire (Décret n° 2-24-706, BO n° 7321) -------------
# Versée en septembre, dans la limite de six enfants scolarisés. Les valeurs
# sont nulles jusqu'au 1er septembre 2024, première rentrée couverte par le
# décret ; le paramètre porte la date de paiement, pas la date de publication.
# Aucune rentrée de septembre ne tombe entre décembre 2023 et août 2024.
# Un mois de septembre antérieur à décembre 2023 lève une erreur de paramètre ;
# les autres mois renvoient zéro avant la lecture des paramètres.

aide_rentree_scolaire:
  description: Aide de rentrée scolaire de l'ASD

  montant_primaire_collegial:
    description: Montant par enfant scolarisé au primaire ou au secondaire collégial
    unit: currency-MAD
    metadata:
      reference:
        - title: >-
            Décret n° 2-24-706 (BO n° 7321 du 29 juillet 2024), complétant
            l'annexe du Décret n° 2-23-1067 — 200 DH par enfant au primaire ou
            au collégial
          href: https://www.anss.gov.ma/fr/typologies-d-aides
    values:
      2023-12-01:
        value: 0.0
      2024-09-01:
        value: 200.0

  montant_qualifiant:
    description: Montant par enfant scolarisé au secondaire qualifiant
    unit: currency-MAD
    metadata:
      reference:
        - title: >-
            Décret n° 2-24-706 (BO n° 7321 du 29 juillet 2024) — 300 DH par
            enfant au secondaire qualifiant
          href: https://www.anss.gov.ma/fr/typologies-d-aides
    values:
      2023-12-01:
        value: 0.0
      2024-09-01:
        value: 300.0

  plafond_enfants:
    description: >-
      Nombre maximal d'enfants scolarisés ouvrant droit à l'aide de rentrée ;
      le plafond porte sur le nombre d'enfants, pas sur leur rang
    unit: /1
    metadata:
      reference:
        - title: >-
            Décret n° 2-24-706 (BO n° 7321 du 29 juillet 2024) et ANSS — aide
            attribuée dans la limite de six enfants scolarisés par ménage
          href: https://www.anss.gov.ma/fr/typologies-d-aides
    values:
      2023-12-01:
        value: 0
      2024-09-01:
        value: 6

# --- Aide spéciale aux enfants placés (Décret n° 2-25-1064, BO n° 7468) ----

aide_speciale_enfant_place:
  description: Aide spéciale mensuelle aux enfants placés en établissement

  montant_mensuel:
    description: >-
      Montant mensuel par enfant orphelin ou abandonné hébergé dans un
      établissement de protection sociale (nul avant l'entrée en vigueur)
    unit: currency-MAD
    metadata:
      reference:
        - title: >-
            Décret n° 2-25-1064 (BO n° 7468 du 25 décembre 2025), articles 11
            et 15 — 500 DH par mois, en vigueur trois mois après publication
          href: https://www.anss.gov.ma/fr/typologies-d-aides
    values:
      2023-12-01:
        value: 0.0
      2026-03-25:
        value: 500.0

# --- Prime exceptionnelle (Loi n° 41-26, Décret n° 2-26-434) ---------------

prime_exceptionnelle:
  description: Prime exceptionnelle après une déclaration à la CNSS

  mois_max:
    description: >-
      Durée maximale de la prime, en mois continus ou non (nulle avant
      l'entrée en vigueur du décret d'application)
    unit: month
    metadata:
      reference:
        - title: >-
            Décret n° 2-26-434 (BO n° 7530 du 30 juillet 2026), article 10 bis
            — douze mois, continus ou non ; entrée en vigueur à la publication
            du texte d'application (Loi n° 41-26, BO n° 7523, article 3)
          href: https://www.anss.gov.ma/fr/typologies-d-aides
    values:
      2023-12-01:
        value: 0
      2026-07-30:
        value: 12
