# Prime d'ancienneté — article 350 du Code du travail (Loi n° 65-99).
#
# Tout salarié bénéficie d'une prime d'ancienneté calculée sur le salaire versé,
# sauf si le salaire est déjà basé sur l'ancienneté par le contrat, le règlement
# intérieur ou la convention collective. Les taux sont des paliers, pas des
# taux marginaux : 5 % après 2 ans, 10 % après 5 ans, 15 % après 12 ans, 20 %
# après 20 ans et 25 % après 25 ans.
#
# L'article 353 définit l'assiette : salaire proprement dit, accessoires et
# majorations pour heures supplémentaires, à l'exclusion notamment des
# prestations familiales, pourboires, gratifications, participations aux
# bénéfices, remboursements de frais et primes de sujétion. Le modèle prend
# `salaire_de_base` comme assiette : l'appelant y agrège les éléments retenus.
