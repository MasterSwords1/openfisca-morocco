# Indemnité de licenciement — articles 52 et 53 du Code du travail (Loi 65-99).
#
# Le salarié lié par un CDI a droit à une indemnité en cas de licenciement
# après six mois de travail dans la même entreprise (art. 52). Pour chaque
# année ou fraction d'année de travail effectif, l'indemnité est égale à
# 96 heures de salaire pour les cinq premières années, 144 heures pour les
# années 6 à 10, 192 heures pour les années 11 à 15 et 240 heures au-delà
# (art. 53). Une fraction d'année compte comme une année entière.
description: Indemnité légale de licenciement - articles 52 et 53 du Code du travail
