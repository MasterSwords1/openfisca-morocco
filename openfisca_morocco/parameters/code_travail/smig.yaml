# Salaire minimum interprofessionnel garanti (SMIG) — article 356 du Code du
# travail. Le SMIG non agricole est fixé par décret après avis des partenaires
# sociaux. Depuis le passage aux 44 heures hebdomadaires, le montant mensuel de
# référence est calculé sur 191 heures.
#
# Série non agricole retenue de 2004 à 2026. Les montants mensuels sont ceux
# publiés (heure × 191), arrondis au centime.
description: SMIG non agricole - article 356 du Code du travail
