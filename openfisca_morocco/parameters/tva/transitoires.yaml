# Taux transitoires de la TVA, 2024-2026.
#
# La loi de finances n° 55-23 pour 2024 ramène l'essentiel des opérations aux
# deux taux généraux de 20 % et 10 %, mais l'article 247-XXXXI organise des
# trajectoires pluriannuelles pour sept catégories d'opérations. Ces taux ne
# sont pas des taux généraux: ils s'appliquent à l'opération déclarée, et une
# entreprise peut n'être concernée par aucun d'entre eux.
#
# Source: corpus `morocco-holy-graph`, dataset vérifié
# `laws/ma_tax_law/data/tva_rate_history.json` (champ `transitional_schedules`),
# lui-même gardé par `tests/test_tva_rate_history.py`.
description: Taux transitoires de la TVA (article 247-XXXXI du CGI, loi n° 55-23)
electricite:
  description: Énergie électrique — taux de 14 % majoré jusqu'au taux normal
  taux:
    description: Taux applicable aux opérations portant sur l'énergie électrique
    unit: /1
    metadata:
      reference:
        - title: Loi de finances n° 55-23 pour 2024, article 247-XXXXI-B — énergie électrique 16 % / 18 % / 20 %
          href: https://maloi.ma/fr/law/code-impots/article/247
    values:
      2024-01-01:
        value: 0.16
      2025-01-01:
        value: 0.18
      2026-01-01:
        value: 0.2
compteur_electricite:
  description: Location du compteur d'électricité — taux de 7 % majoré jusqu'au taux normal
  taux:
    description: Taux applicable à la location du compteur d'électricité
    unit: /1
    metadata:
      reference:
        - title: Loi de finances n° 55-23 pour 2024, article 247-XXXXI-C — location du compteur d'électricité 11 % / 15 % / 20 %
