# Barème mensuel de la retenue à la source sur les salaires.
# Article 73-I du Code Général des Impôts fixe le barème annuel ; la retenue
# mensuelle opérée par l'employeur applique la table mensuelle de la DGI,
# obtenue en divisant ce barème par douze, seuils et sommes à déduire compris.
#
# Deux barèmes sont encodés :
#   - du 2010-01-01 au 2024-12-31 (barème annuel de la Loi de finances n° 48-09
#     pour 2010, divisé par 12) :
#       0 % jusqu'à 2 500 DH ; 10 % de 2 500 à 4 166,67 ;
#       20 % de 4 166,67 à 5 000 ; 30 % de 5 000 à 6 666,67 ;
#       34 % de 6 666,67 à 15 000 ; 38 % au-delà.
#     (sommes à déduire : 0 / 250 / 666,67 / 1 166,67 / 1 433,33 / 2 033,33)
#   - à partir du 2025-01-01 (barème annuel de la Loi de finances n° 60-24 pour
#     2025, divisé par 12) :
#       0 % jusqu'à 3 333,33 DH ; 10 % de 3 333,33 à 5 000 ;
#       20 % de 5 000 à 6 666,67 ; 30 % de 6 666,67 à 8 333,33 ;
#       34 % de 8 333,33 à 15 000 ; 37 % au-delà.
#     (sommes à déduire : 0 / 333,33 / 833,33 / 1 500 / 1 833,33 / 2 283,33)
#
# Les seuils sont ceux publiés au centime. La retenue est calculée sur le
# salaire net imposable du mois, après cotisations sociales et frais
# professionnels ; la déduction pour charges de famille est appliquée ensuite.
