# Déduction forfaitaire pour frais professionnels.
# Article 59 du Code Général des Impôts.
#
# Le forfait est calculé sur les sommes brutes de l'article 56, diminuées des
# éléments exonérés de l'article 57 (soit `salaire_brut_imposable`), et non sur
# le revenu après cotisations sociales : celles-ci sont déduites séparément
# (article 59-II).
#
# Deux régimes sont encodés :
#   - du 2010-01-01 au 2022-12-31 : taux uniforme de 20 %, plafonné à
#     30 000 DH par an. Le taux de 20 % résulte de la Loi de finances n° 40-08
#     pour 2009 ; le plafond de 30 000 DH a été fixé par la Loi de finances
#     n° 48-09 pour 2010.
#   - à partir du 2023-01-01 (Loi de finances n° 50-22 pour 2023) : 35 % pour
#     une rémunération brute annuelle imposable n'excédant pas 78 000 DH, 25 %
#     au-delà, avec un plafond de 35 000 DH dans les deux cas. Le passage de
#     78 000 à 78 001 DH fait basculer tout le forfait de 35 % à 25 % : le
#     législateur a prévu un seuil, pas un taux progressif. La Loi de finances
#     2025 n'a pas modifié l'article 59.
description: Déduction forfaitaire pour frais professionnels - article 59 du CGI
