# Déduction pour charges de famille.
# Article 74 du Code Général des Impôts : il est déduit du montant annuel de
# l'impôt une somme de 500 dirhams par personne à charge (conjoint et enfants
# légitimes ou légalement recueillis), dans la limite de 6 personnes.
