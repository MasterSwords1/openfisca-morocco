# Déduction pour charges de famille.
# Article 74 du Code Général des Impôts : il est déduit du montant annuel de
# l'impôt une somme par personne à charge (conjoint et enfants légitimes ou
# légalement recueillis), dans la limite de 6 personnes.
#
# Montant par personne :
#   - 360 DH du 2010-01-01 au 2024-12-31, plafond de 2 160 DH (Loi de finances
#     n° 40-08 pour 2009, reprise par le CGI 2010) ;
#   - 500 DH en 2025 (Loi de finances n° 60-24 pour 2025, article 8) ;
#   - 600 DH à partir de 2026, plafond de 3 600 DH (Loi de finances n° 50-25
#     pour 2026, article 7).
description: Déduction pour charges de famille - article 74 du CGI
montant_par_personne:
  description: Montant annuel déduit par personne à charge
  unit: currency-MAD
  metadata:
    reference:
      - title: Code Général des Impôts, article 74 (Direction Générale des Impôts)
        href: https://www.sgg.gov.ma/BO/bo_fr/2007/bo_5487-bis_fr.pdf
      - title: >-
          Loi de finances n° 40-08 pour l'année budgétaire 2009, BO n° 5695 bis
          (360 DH, plafond de 2 160 DH)
        href: https://www.sgg.gov.ma/BO/bo_fr/2008/bo_5695-bis_fr.pdf
      - title: >-
          Loi de finances n° 60-24 pour l'année budgétaire 2025, BO n° 7362 bis
          (500 DH)
        href: https://www.sgg.gov.ma/BO/FR/2873/2024/BO_7362_fr.pdf
      - title: >-
          Loi de finances n° 50-25 pour l'année budgétaire 2026, BO n° 7465 bis
          (600 DH, plafond de 3 600 DH)
        href: https://www.sgg.gov.ma/BO/FR/2873/2025/BO_7465-bis_fr.pdf
  values:
    2010-01-01:
      value: 360.0
    2025-01-01:
      value: 500.0
    2026-01-01:
      value: 600.0
