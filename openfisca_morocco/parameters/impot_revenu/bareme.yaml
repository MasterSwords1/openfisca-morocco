# Barème progressif annuel de l'impôt sur le revenu (IR).
# Article 73-I du Code Général des Impôts (Loi n° 43-06), tel que réformé par la
# Loi de Finances 2025. Le barème s'applique au revenu net imposable annuel.
# Les barèmes antérieurs à 2025 ne sont pas encore encodés.
# Impôt = taux × revenu − somme à déduire (par tranche) :
#   ≤ 40 000 DH : 0 %
#   40 001–60 000 : 10 % (à déduire : 4 000)
#   60 001–80 000 : 20 % (à déduire : 10 000)
#   80 001–100 000 : 30 % (à déduire : 18 000)
#   100 001–180 000 : 34 % (à déduire : 22 000)
#   > 180 000 : 37 % (à déduire : 27 400)
