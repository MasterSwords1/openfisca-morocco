# Barème progressif annuel de l'impôt sur le revenu (IR).
# Article 73-I du Code Général des Impôts (Loi n° 43-06).
#
# Deux barèmes sont encodés :
#   - du 2010-01-01 au 2024-12-31 (Loi de finances n° 48-09 pour 2010) :
#       ≤ 30 000 DH : 0 % ; 30 001–50 000 : 10 % ; 50 001–60 000 : 20 % ;
#       60 001–80 000 : 30 % ; 80 001–180 000 : 34 % ; > 180 000 : 38 %
#     (sommes à déduire : 0 / 3 000 / 8 000 / 14 000 / 17 200 / 24 400)
#   - à partir du 2025-01-01 (Loi de finances n° 60-24 pour 2025) :
#       ≤ 40 000 DH : 0 % ; 40 001–60 000 : 10 % ; 60 001–80 000 : 20 % ;
#       80 001–100 000 : 30 % ; 100 001–180 000 : 34 % ; > 180 000 : 37 %
#     (sommes à déduire : 0 / 4 000 / 10 000 / 18 000 / 22 000 / 27 400)
