# Régimes professionnels de l'IR.
#
# Sources : Code Général des Impôts (édition 2026), articles 12 (report
# déficitaire), 32 à 44 (régimes), 73-II-B-6° et 73-III (taux et droits
# complémentaires). La table des droits complémentaires est lue dans l'édition
# consolidée du corpus (CGI-2026-FR, art. 73-II-B-6°).

description: Régimes de détermination du revenu professionnel

net_simplifie:
  description: Régime du résultat net simplifié

  abattement_centre_gestion:
    description: >-
      Abattement de la base imposable pour les adhérents des centres de gestion
      de comptabilité agréés (article 38-III)
    unit: /1
    metadata:
      reference:
        - title: Code Général des Impôts, article 38-III — abattement de 15 %
          href: https://www.sgg.gov.ma/BO/bo_fr/2007/bo_5487-bis_fr.pdf
    values:
      2026-01-01:
        value: 0.15

cpu:
  description: Contribution professionnelle unique (articles 40 et 73-II-B-6°)

  taux:
    description: Taux appliqué à la base obtenue en multipliant le chiffre d'affaires par le coefficient
