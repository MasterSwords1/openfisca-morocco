services:
  api:
    build:
      context: ..
      dockerfile: explorer/Dockerfile.api
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/spec')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  explorer:
    build:
      context: ..
      dockerfile: explorer/Dockerfile
      args:
        API_URL: ${EXPLORER_API_URL:-http://localhost:5000}
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVER_API_URL: ${SERVER_API_URL:-http://api:5000}
      API_URL: ${EXPLORER_API_URL:-http://localhost:5000}
      CHANGELOG_URL: ${CHANGELOG_URL:-https://github.com/MasterSwords1/openfisca-morocco/blob/main/CHANGELOG.md}
      PATHNAME: /
      HOST: 0.0.0.0
      PORT: 2020
      UI_STRINGS: '{"en":{"countryName":"Morocco"},"fr":{"countryName":"le Maroc"}}'
    ports:
      - "2020:2020"
