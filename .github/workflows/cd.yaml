---
name: Continuous deployment
on:
  workflow_dispatch:

concurrency:
  group: pypi-release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check the release preconditions
        if: github.ref != 'refs/heads/main' || github.event.repository.visibility != 'public'
        run: |
          echo "::error::Releases must be dispatched from public main."
          exit 1

      - uses: actions/checkout@v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Build
        run: uv build

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish
  push-tag:
    permissions:
      contents: write
    needs:
      - publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Add tag on GitHub
        run: |
          version="$(uv version --short)"
          git tag "$version"
          git push origin "refs/tags/$version"
