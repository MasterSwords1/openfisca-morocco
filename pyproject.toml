[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools-scm"]

[project]
name = "openfisca-morocco"
version = "0.18.0"
description = "OpenFisca Rules as Code model for Morocco."
readme = "README.md"
keywords = [ "benefit", "microsimulation", "rac", "rules-as-code", "tax" ]
maintainers = [  ]
authors = [  ]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license="AGPL-3.0-or-later"

dependencies = [
    "openfisca-core[web-api]>=46.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9,<1",
    "ruff-lsp>=0.0.57,<1",
    "yamllint>=1.35.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9,<1",
    "ruff-lsp>=0.0.57,<1",
    "yamllint>=1.35.1",
    "twine",
    "pre-commit>=4.3.0",
]

[project.urls]
Changelog = "https://github.com/MasterSwords1/openfisca-morocco/blob/main/CHANGELOG.md"
Documentation = "https://openfisca.org/doc"
Homepage = "https://github.com/MasterSwords1/openfisca-morocco"
Issues = "https://github.com/MasterSwords1/openfisca-morocco/issues"
Repository = "https://github.com/MasterSwords1/openfisca-morocco"

[tool.ruff]
target-version = "py311"
format.docstring-code-line-length = 72
format.docstring-code-format = true
lint.pydocstyle.convention = "google"

[tool.ruff.lint.isort]
known-first-party = [ "openfisca_morocco" ]
combine-as-imports = true
force-single-line = false

[tool.pyproject-fmt]
column_width = 79
indent = 4
max_supported_python = "3.14"

[tool.pytest.ini_options]
addopts = "--exitfirst --showlocals --doctest-modules --disable-warnings --import-mode importlib"
testpaths = [ "openfisca_morocco/tests" ]
python_files = "**/*.py"

[tool.setuptools.packages.find]
include = ["openfisca_morocco*"]
exclude = ["explorer*"]

[tool.setuptools.package-data]
openfisca_morocco = [
    "data/*.json",
    "parameters/**/*.yaml",
    "situation_examples/*.json",
    "tests/**/*.yaml",
]
